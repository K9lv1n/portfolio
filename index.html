<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kalvin Chin — Applied AI, data analytics and software portfolio." />
    <meta name="theme-color" content="#f4f2ee" />
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('portfolio-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (error) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <title>Kalvin Chin · Applied AI Portfolio</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio requires JavaScript.</noscript>
    <script>
      window.__portfolioBootErrors = []
      window.addEventListener('error', function (event) {
        window.__portfolioBootErrors.push(event.message || 'Unknown JavaScript error')
      })
    </script>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="/src/data.js"></script>
    <script src="/src/app.js"></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && !root.firstElementChild) {
          root.innerHTML = '<main style="max-width:760px;margin:80px auto;padding:24px;font-family:system-ui;color:#111"><h1>Portfolio failed to start</h1><p>The page loaded, but the React app did not mount.</p><pre style="white-space:pre-wrap;padding:16px;background:#f1f1f1;border-radius:12px">' + (window.__portfolioBootErrors.join('\n') || 'No browser error was captured. Open DevTools Console for details.') + '</pre></main>'
        }
      }, 1200)
    </script>
  </body>
</html>
